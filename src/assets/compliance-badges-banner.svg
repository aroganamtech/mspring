<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300">
  <defs>
    <style>
      .cap { font-family: 'Roboto', 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; text-anchor: middle; letter-spacing: 0.02em; }
      .icon { fill: none; stroke: #4f9eea; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #4f9eea; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="300" rx="18" fill="#0b0f1a" />

  <!-- HIPAA -->
  <g transform="translate(60,40)">
    <path class="icon" d="M60 8 L108 26 V70 C108 108 84 130 60 142 C36 130 12 108 12 70 V26 Z" />
    <rect class="icon-fill" x="52" y="46" width="16" height="56" rx="3" />
    <rect class="icon-fill" x="32" y="66" width="56" height="16" rx="3" />
    <text class="cap" x="60" y="176">HIPAA</text>
    <text class="cap" x="60" y="204">COMPLIANT</text>
  </g>

  <!-- GDPR -->
  <g transform="translate(258,40)">
    <circle class="icon" cx="60" cy="70" r="58" />
    <path class="icon" d="M38 70 L54 86 L86 50" stroke-width="8" />
    <g class="icon-fill">
      <circle cx="60" cy="6" r="5" />
      <circle cx="60" cy="134" r="5" />
      <circle cx="124" cy="70" r="5" />
      <circle cx="-4" cy="70" r="5" />
      <circle cx="105" cy="25" r="5" />
      <circle cx="15" cy="115" r="5" />
      <circle cx="105" cy="115" r="5" />
      <circle cx="15" cy="25" r="5" />
    </g>
    <text class="cap" x="60" y="176">GDPR</text>
    <text class="cap" x="60" y="204">COMPLIANT</text>
  </g>

  <!-- AES 256-bit SSL -->
  <g transform="translate(456,40)">
    <path class="icon" d="M30 62 V44 a30 30 0 0 1 60 0 v18" />
    <rect class="icon" x="18" y="62" width="84" height="62" rx="10" />
    <circle class="icon-fill" cx="60" cy="90" r="8" />
    <rect class="icon-fill" x="56" y="94" width="8" height="20" rx="3" />
    <text class="cap" x="60" y="176">AES 256-BIT</text>
    <text class="cap" x="60" y="204">SSL SECURED</text>
  </g>

  <!-- ISO 27001 -->
  <g transform="translate(654,40)">
    <circle class="icon" cx="60" cy="70" r="58" />
    <ellipse class="icon" cx="60" cy="70" rx="24" ry="58" />
    <line class="icon" x1="2" y1="70" x2="118" y2="70" />
    <line class="icon" x1="14" y1="38" x2="106" y2="38" />
    <line class="icon" x1="14" y1="102" x2="106" y2="102" />
    <text class="cap" x="60" y="176">ISO 27001</text>
    <text class="cap" x="60" y="204">CERTIFIED</text>
  </g>

  <!-- Dun & Bradstreet -->
  <g transform="translate(852,40)">
    <circle class="icon" cx="60" cy="70" r="58" />
    <text x="60" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#ffffff">&amp;</text>
    <text class="cap" x="60" y="176">DUN &amp; BRADSTREET</text>
    <text class="cap" x="60" y="204">SEAL</text>
  </g>
</svg>
